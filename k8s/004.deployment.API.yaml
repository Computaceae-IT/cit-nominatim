apiVersion: apps/v1
kind: Deployment
metadata:
  name: nominatim-api
  namespace: business-service
  labels:
    app: nominatim-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nominatim-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: nominatim-api
        date: DATE_DEPLOYMENT
    spec:
      containers:
      - name: nominatim-api
        image: registry.computaceae-it.tech/cit-nominatim-api@sha256:API_IMAGE_DIGEST
        imagePullPolicy: Always
        command: ["sh"]
        args: ["/app/startapache.sh"]
        resources:
          requests:
            cpu: 100m
            memory: 15Mi
          limits:
            cpu: 500m
            memory: 500Mi
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        startupProbe:
          httpGet:
            path: /status.php
            port: http
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 24
        readinessProbe:
          httpGet:
            path: /status.php
            port: http
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        livenessProbe:
          tcpSocket:
            port: http
          periodSeconds: 30
          timeoutSeconds: 3
          failureThreshold: 3
