name: Security preparation
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s tests -v
      - run: sh -n API/verify-php.sh && sh -n API/startapache.sh && sh -n DB/verify-php.sh && sh -n DB/startpostgres.sh && sh -n scripts/inspect-db.sh
      - run: git diff --check
# No image build/push or production access. DB persistence is not yet verified.
